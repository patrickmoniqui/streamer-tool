name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/lib/dancefloor.ts"
      - "src/lib/twitchEventSub.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Initialize Dancefloor tables
        run: npx wrangler d1 execute ANALYTICS_DB --remote --config worker/wrangler.toml --file worker/sql/dancefloor.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Configure Dancefloor encryption
        run: |
          test -n "$DANCEFLOOR_ENCRYPTION_KEY"
          printf '%s' "$DANCEFLOOR_ENCRYPTION_KEY" | npx wrangler secret put DANCEFLOOR_ENCRYPTION_KEY --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DANCEFLOOR_ENCRYPTION_KEY: ${{ secrets.DANCEFLOOR_ENCRYPTION_KEY }}
      - name: Deploy Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
